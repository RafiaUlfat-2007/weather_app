<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Full page background image */
        body {
            margin: 0;
            padding: 0; /* ⚠️ padding hata do */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh; /* 🔥 important */
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
        

        /* Weather card with glass effect */
        .box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 320px;
            max-width: 85%;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .box:hover::before {
            left: 100%;
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Heading */
        h2 {
            font-size: 32px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            color: #FFD700;
            font-weight: 600;
        }

        /* Input */
        input {
            width: 85%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            outline: none;
            margin-bottom: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            color: black;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            border-color: #FFD700;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Button */
        button{
            width: 85%;
            padding: 12px 30px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ffa500, #ff6b6b);
        }

        /* Weather Image */ 
        img {
            width: 100px;
            height: 100px;
            margin: 10px 0;
        }

        /* Weather info text */
        p {
            font-size: 15px;
            margin: 6px 0;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            font-weight: 500;
            line-height: 1.4;
            font-weight: 500;
        }

        /* Location */
        #location {
            font-size: 22px;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 15px;
        }

        /* Error message */
        #error {
            color: #ff6b6b;
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
        }

        /* Loading animation */
        .loading {
            display: none;
            font-size: 18px;
            color: #FFD700;
        }

        /* Weather icon center position */
        #icon {
            display: block;        /* Block element bana do */
            margin: 10px auto;     /* Horizontally center */
            width: 100px;          /* Default width */
            height: 100px;         /* Default height */
            object-fit: contain;   /* Image stretch na ho, aspect ratio maintain ho */
        }

        /* Responsive Styles */
        @media screen and (max-width: 768px) {
            body {
                padding: 15px;
                min-height: 100vh;
            }
            .box {
                width: 90%;
                max-width: 90%;
                padding: 25px 20px;
                min-height: auto;
            }
            h2 {
                font-size: 26px;
                margin-bottom: 18px;
            }
            input {
                width: 100%;
                padding: 11px 12px;
                font-size: 14px;
                margin-bottom: 12px;
            }
            button {
                width: 100%;
                padding: 11px 20px;
                font-size: 14px;
                margin-bottom: 12px;
            }
            img {
                width: 85px;
                height: 85px;
                margin: 8px 0;
            }
            p {
                font-size: 14px;
                margin: 5px 0;
            }
            #location {
                font-size: 18px;
                margin-bottom: 10px;
            }
            #icon {
                width: 85px;
                height: 85px;
            }
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 10px;
                min-height: 100vh;
            }
            .box {
                width: 95%;
                max-width: 95%;
                padding: 20px 15px;
                min-height: auto;
            }
            h2 {
                font-size: 22px;
                margin-bottom: 15px;
            }
            input {
                width: 100%;
                padding: 10px;
                font-size: 13px;
                margin-bottom: 10px;
            }
            button {
                width: 100%;
                padding: 10px 15px;
                font-size: 13px;
                margin-bottom: 10px;
            }
            img {
                width: 75px;
                height: 75px;
                margin: 8px 0;
            }
            p {
                font-size: 12px;
                margin: 4px 0;
            }
            #location {
                font-size: 15px;
                margin-bottom: 8px;
            }
            #error {
                font-size: 14px;
                margin-top: 10px;
            }
            #icon {
                width: 75px;
                height: 75px;
            }
        }

        @media screen and (max-height: 600px) {
            body {
                min-height: auto;
            }
            .box {
                padding: 15px 12px;
            }
            h2 {
                margin-bottom: 12px;
                font-size: 24px;
            }
            input {
                padding: 8px 10px;
                margin-bottom: 8px;
            }
            button {
                padding: 8px 15px;
                margin-bottom: 8px;
            }
            img {
                width: 70px;
                height: 70px;
                margin: 5px 0;
            }
            p {
                font-size: 12px;
                margin: 3px 0;
            }
            #icon {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <h2><i class="fas fa-cloud-sun"></i> Weather App</h2>
        <input type="text" id="city" placeholder="Enter city name...">
        <button onclick="getWeather()"><i class="fas fa-search"></i> Get Weather</button>
        <div class="loading" id="loading">Loading...</div>
        <p id="location"></p>
        <img id="icon" src="" alt="Weather Icon">
        <p id="temp"></p>
        <p id="humidity"></p>
        <p id="weather"></p>
        <p id="wind"></p>
        <p id="error"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
